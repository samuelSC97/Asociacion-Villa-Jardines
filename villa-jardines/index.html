<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villa Jardines — Asociación de Vecinos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/vecino.css" />
</head>
<body>

  <!-- LOADING -->
  <div id="loading">
    <div class="spinner"></div>
    <span>Cargando...</span>
  </div>

  <!-- ===== LOGIN ===== -->
  <div id="s-login" class="screen">
    <div class="login-wrap">
      <div class="login-logo">
        <div class="login-icon">🏘️</div>
        <h1>Villa Jardines</h1>
        <p>Asociación de Vecinos</p>
      </div>
      <div class="login-card">
        <div class="tab-row">
          <button class="tab-btn active" onclick="Auth.switchTab('admin')">Administrador</button>
          <button class="tab-btn" onclick="Auth.switchTab('vecino')">Vecino</button>
        </div>

        <div id="login-admin-form">
          <div class="field">
            <label>Usuario</label>
            <input type="text" id="l-user" value="admin" placeholder="admin" />
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" id="l-pass" placeholder="••••••"
              onkeydown="if(event.key==='Enter') Auth.doLogin()" />
          </div>
          <button class="btn btn-dark" onclick="Auth.doLogin()">Ingresar</button>
        </div>

        <div id="login-vecino-form" style="display:none">
          <div class="field">
            <label>Busca por nombre o DNI</label>
            <input type="text" id="l-busca" placeholder="Ej: Quispe o 73780984"
              oninput="Auth.buscarVecino()" />
          </div>
          <div id="l-resultados"></div>
        </div>

        <div id="l-msg"></div>
      </div>
      <p class="login-hint">Sistema interno · Villa Jardines © 2025</p>
    </div>
  </div>

  <!-- ===== ADMIN ===== -->
  <div id="s-admin" class="screen">
    <header class="header">
      <div class="header-info">
        <div class="header-title">Villa Jardines</div>
        <div class="header-sub">Panel de administración</div>
      </div>
      <span class="badge badge-admin">Admin</span>
      <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Salir</button>
    </header>
    <nav class="nav" id="admin-nav">
      <button class="nav-btn active" onclick="AdminApp.tab('inicio')">Inicio</button>
      <button class="nav-btn" onclick="AdminApp.tab('asistencia')">Asistencia</button>
      <button class="nav-btn" onclick="AdminApp.tab('vecinos')">Vecinos</button>
      <button class="nav-btn" onclick="AdminApp.tab('pagos')">Pagos</button>
      <button class="nav-btn" onclick="AdminApp.tab('documentos')">Documentos</button>
    </nav>
    <main class="content" id="admin-body"></main>
  </div>

  <!-- ===== VECINO ===== -->
  <div id="s-vecino" class="screen">
    <header class="header">
      <div class="header-info">
        <div class="header-title" id="v-nombre">Mi cuenta</div>
        <div class="header-sub" id="v-sub">—</div>
      </div>
      <span class="badge badge-vecino">Vecino</span>
      <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Salir</button>
    </header>
    <nav class="nav" id="vecino-nav">
      <button class="nav-btn active" onclick="VecinoApp.tab('inicio')">Inicio</button>
      <button class="nav-btn" onclick="VecinoApp.tab('faltas')">Mis faltas</button>
      <button class="nav-btn" onclick="VecinoApp.tab('pagos')">Mis pagos</button>
      <button class="nav-btn" onclick="VecinoApp.tab('documentos')">Documentos</button>
    </nav>
    <main class="content" id="vecino-body"></main>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin/inicio.js"></script>
  <script src="js/admin/asistencia.js"></script>
  <script src="js/admin/vecinos.js"></script>
  <script src="js/admin/pagos.js"></script>
  <script src="js/admin/documentos.js"></script>
  <script src="js/admin/index.js"></script>
  <script src="js/vecino/inicio.js"></script>
  <script src="js/vecino/faltas.js"></script>
  <script src="js/vecino/pagos.js"></script>
  <script src="js/vecino/documentos.js"></script>
  <script src="js/vecino/index.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
